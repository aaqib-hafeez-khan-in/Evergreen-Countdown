<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Countdown | Dynamic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <div class="stars" aria-hidden="true"></div>

    <header class="theme-toggle">
        <button id="themeToggle" type="button" aria-label="Switch to light theme" aria-pressed="false">
            <i class="fas fa-moon" aria-hidden="true"></i>
        </button>
    </header>

    <main class="container">
        <header class="title-wrap">
            <p id="title" class="title">Official Countdown</p>
            <h1 id="mainHeading" class="main-heading">Countdown</h1>
            <p id="timezone" class="timezone">Target timezone: UTC</p>
        </header>
        
        <section id="countdown" class="countdown" role="timer" aria-label="Countdown to target" aria-live="polite" aria-atomic="true">
            <div class="time-segment">
                <div class="time-card">
                    <span class="number" id="days">00</span>
                </div>
                <span class="label">Days</span>
            </div>
            <div class="time-segment">
                <div class="time-card">
                    <span class="number" id="hours">00</span>
                </div>
                <span class="label">Hours</span>
            </div>
            <div class="time-segment">
                <div class="time-card">
                    <span class="number" id="minutes">00</span>
                </div>
                <span class="label">Minutes</span>
            </div>
            <div class="time-segment">
                <div class="time-card">
                    <span class="number" id="seconds">00</span>
                </div>
                <span class="label">Seconds</span>
            </div>
        </section>

        <aside class="quote-container" aria-label="Countdown quote">
            <p id="quote" aria-live="off">The magic in new beginnings is truly the most powerful of them all.</p>
        </aside>
    </main>

    <section id="newYearMessage" class="new-year-message" aria-hidden="true" aria-live="assertive" hidden>
        <h2>Countdown complete</h2>
        <p>A new beginning has arrived.</p>
    </section>

    <script src="countdown-engine.js"></script>
    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
